<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SIT ADFS TOTP Autofill</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <main>
    <header>
      <img src="icons/icon48.png" alt="">
      <div>
        <h1>SIT ADFS TOTP</h1>
        <div class="muted">SHA-256・6桁・30秒</div>
      </div>
    </header>

    <section id="setupPanel" class="card" hidden>
      <p id="setupMessage">初期設定が必要です。</p>
      <button id="openOptionsFromSetup">設定を開く</button>
    </section>

    <section id="unlockPanel" class="card" hidden>
      <label>
        マスターパスワード
        <input id="unlockPassword" type="password" autocomplete="current-password">
      </label>
      <button id="unlockButton">解除</button>
    </section>

    <section id="codePanel" class="card" hidden>
      <div class="code-line">
        <div id="code" class="code">--- ---</div>
        <button id="copyButton" class="icon-button" type="button"
          title="コードをコピー" aria-label="コードをコピー">
          <svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="8" y="8" width="11" height="11" rx="2"></rect>
            <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path>
          </svg>
          <svg class="check-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m5 12 4 4L19 6"></path>
          </svg>
        </button>
      </div>
      <div class="row between">
        <span class="muted">現在のTOTP</span>
        <span id="remaining" class="muted">--秒</span>
      </div>
      <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>
      <div class="row wrap">
        <button id="lockButton" class="secondary">ロック</button>
      </div>
    </section>

    <button id="optionsButton" class="secondary">設定</button>
    <p id="message" class="message" aria-live="polite"></p>
  </main>
  <script src="visibility.js"></script>
  <script src="popup.js"></script>
</body>
</html>
