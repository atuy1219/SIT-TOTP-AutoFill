name: Remove remaining background wait by lines

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-expiry-wait
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove remaining wait branch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/background.js")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          matches = [
              index for index, line in enumerate(lines)
              if "if (result.remaining <= settings.minRemainingSeconds)" in line
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one wait branch, found {len(matches)}")

          start = matches[0]
          end = next(
              index for index in range(start + 1, len(lines))
              if lines[index].rstrip("\r\n") == "      }"
          )
          if end + 1 < len(lines) and not lines[end + 1].strip():
              end += 1
          del lines[start:end + 1]
          path.write_text("".join(lines), encoding="utf-8")
          PY
      - name: Verify cleanup
        run: |
          ! grep -RInE 'minRemainingSeconds|reason: "wait"|waitMs|Manifest V3|MV3 builds|-mv3-v' README.md src scripts
          npm run check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/background.js
          git commit -m "Remove remaining TOTP wait branch"
          git push origin HEAD:agent/remove-expiry-wait
