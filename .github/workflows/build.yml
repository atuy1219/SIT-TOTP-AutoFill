name: Build extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: sit-adfs-totp-autofill
          path: release/*.zip
          if-no-files-found: error
