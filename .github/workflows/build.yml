name: Build extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: scombz-login-helper-chromium
          path: dist/chromium/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: scombz-login-helper-firefox
          path: dist/firefox/
          if-no-files-found: error
