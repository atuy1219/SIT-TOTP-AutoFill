name: Build extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply-update:
    if: contains(github.event.head_commit.message, '[apply-ui-update]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply requested changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_all(path, old, new, minimum=1):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"Expected at least {minimum} matches in {path}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "src/background.js",
              'masterPassword.length < 8',
              'masterPassword.length < 6'
          )
          replace_once(
              "src/background.js",
              'マスターパスワードは8文字以上にしてください。',
              'マスターパスワードは6文字以上にしてください。'
          )

          preview_block = '''      <button id="initialPreviewButton" type="button" class="secondary">現在のコードを確認</button>
          <div id="initialPreview" class="totp-preview" hidden>
            <div>
              <div class="muted">Microsoft Authenticatorのコードと一致することを確認してください</div>
              <strong id="initialPreviewCode" class="preview-code">------</strong>
            </div>
            <span id="initialPreviewRemaining" class="muted">残り--秒</span>
          </div>

          '''
          replace_once("src/options.html", preview_block, "")
          replace_once(
              "src/options.html",
              '          <input id="initialMasterPassword" type="password" autocomplete="new-password">',
              '          <input id="initialMasterPassword" type="password" autocomplete="new-password" minlength="6">\n'
              '          <span id="initialMasterPasswordRequirement" class="input-requirement" hidden>6文字以上。数字のみでも使用できます。</span>'
          )
          replace_once(
              "src/options.html",
              '          <input id="initialMasterPasswordConfirm" type="password" autocomplete="new-password">',
              '          <input id="initialMasterPasswordConfirm" type="password" autocomplete="new-password" minlength="6">'
          )
          replace_once(
              "src/options.html",
              '            <input id="exportPassword" type="password" autocomplete="new-password">',
              '            <input id="exportPassword" type="password" autocomplete="new-password" minlength="6">\n'
              '            <span id="exportPasswordRequirement" class="input-requirement" hidden>6文字以上。数字のみでも使用できます。</span>'
          )
          replace_once(
              "src/options.html",
              '            <input id="exportPasswordConfirm" type="password" autocomplete="new-password">',
              '            <input id="exportPasswordConfirm" type="password" autocomplete="new-password" minlength="6">'
          )
          dialog = '''    <dialog id="initialCodeDialog" class="code-dialog">
              <h2>現在のコードを確認</h2>
              <p class="muted">Microsoft Authenticatorに表示されているコードと一致することを確認してください。</p>
              <div class="saved-code-row">
                <strong id="initialCodeDialogCode" class="dialog-code">------</strong>
                <span id="initialCodeDialogRemaining" class="muted">残り--秒</span>
              </div>
              <button id="initialCodeDialogClose" type="button">閉じる</button>
            </dialog>

          '''
          replace_once(
              "src/options.html",
              '    <p id="message" class="message" aria-live="polite"></p>',
              dialog + '    <p id="message" class="message" aria-live="polite"></p>'
          )

          options = Path("src/options.js")
          text = options.read_text(encoding="utf-8")
          text = text.replace('let initialPreviewTimer = null;', 'let savedCodeTimer = null;', 1)

          helper_marker = '''function showState(state) {'''
          helpers = r'''function enhanceSecretInputs() {
            const eyeIcon = `
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                <circle cx="12" cy="12" r="2.75"></circle>
              </svg>`;

            for (const input of document.querySelectorAll('input[type="password"]')) {
              if (input.parentElement?.classList.contains("secret-input-wrap")) continue;
              const wrapper = document.createElement("span");
              wrapper.className = "secret-input-wrap";
              input.parentNode.insertBefore(wrapper, input);
              wrapper.append(input);

              const button = document.createElement("button");
              button.type = "button";
              button.className = "password-toggle";
              button.title = "入力内容を表示";
              button.setAttribute("aria-label", "入力内容を表示");
              button.innerHTML = eyeIcon;
              button.addEventListener("click", () => {
                const visible = input.type === "text";
                input.type = visible ? "password" : "text";
                button.classList.toggle("visible", !visible);
                button.title = visible ? "入力内容を表示" : "入力内容を隠す";
                button.setAttribute(
                  "aria-label",
                  visible ? "入力内容を表示" : "入力内容を隠す"
                );
                input.focus();
              });
              wrapper.append(button);
            }
          }

          function bindRequirementHint(inputId, hintId) {
            const input = byId(inputId);
            const hint = byId(hintId);
            const show = () => { hint.hidden = false; };
            const hide = () => { if (!input.value) hint.hidden = true; };
            input.addEventListener("focus", show);
            input.addEventListener("input", show);
            input.addEventListener("blur", hide);
          }

          function stopSavedCodeDialog() {
            clearInterval(savedCodeTimer);
            savedCodeTimer = null;
          }

          async function refreshSavedCodeDialog() {
            const result = await send("currentCode");
            if (!result?.ok) {
              throw new Error(result?.error || "コードを取得できません。");
            }
            byId("initialCodeDialogCode").textContent = result.code;
            byId("initialCodeDialogRemaining").textContent = `残り${result.remaining}秒`;
          }

          async function showSavedCodeDialog() {
            stopSavedCodeDialog();
            await refreshSavedCodeDialog();
            const dialog = byId("initialCodeDialog");
            if (typeof dialog.showModal === "function") dialog.showModal();
            else dialog.setAttribute("open", "");
            savedCodeTimer = setInterval(() => {
              refreshSavedCodeDialog().catch((error) => {
                stopSavedCodeDialog();
                message(error.message, true);
              });
            }, 1000);
          }

          function closeSavedCodeDialog() {
            stopSavedCodeDialog();
            const dialog = byId("initialCodeDialog");
            if (typeof dialog.close === "function") dialog.close();
            else dialog.removeAttribute("open");
          }

          '''
          if helper_marker not in text:
              raise SystemExit("options.js helper marker not found")
          text = text.replace(helper_marker, helpers + helper_marker, 1)

          pattern = re.compile(
              r'\nfunction stopInitialPreview\(\) \{.*?\nasync function refresh\(\) \{',
              re.S
          )
          text, count = pattern.subn('\nasync function refresh() {', text, count=1)
          if count != 1:
              raise SystemExit("Initial preview functions were not found")

          text = text.replace('  stopInitialPreview();\n\n', '', 1)
          listener_block = '''byId("initialSecret").addEventListener("input", stopInitialPreview);
          byId("initialPreviewButton").addEventListener("click", () => {
            startInitialPreview().catch((error) => message(error.message, true));
          });
          '''
          if listener_block not in text:
              raise SystemExit("Initial preview listener block was not found")
          text = text.replace(listener_block, '', 1)
          text = text.replace('  stopInitialPreview();\n', '', 1)
          text = text.replace(
              '  message("初期設定を保存しました。");\n  await refresh();\n});',
              '  message("初期設定を保存しました。");\n'
              '  await refresh();\n'
              '  showSavedCodeDialog().catch((error) => message(error.message, true));\n'
              '});',
              1
          )
          text = text.replace(
              'バックアップ用パスワードは8文字以上にしてください。',
              'バックアップ用パスワードは6文字以上にしてください。',
              1
          )
          text = text.replace('password.length < 8', 'password.length < 6', 1)

          bottom_marker = '''updateInitialMasterPasswordMode();
          updateInitialAutoLoginMode();'''
          bottom = '''enhanceSecretInputs();
          bindRequirementHint("initialMasterPassword", "initialMasterPasswordRequirement");
          bindRequirementHint("exportPassword", "exportPasswordRequirement");
          byId("initialCodeDialogClose").addEventListener("click", closeSavedCodeDialog);
          byId("initialCodeDialog").addEventListener("close", stopSavedCodeDialog);
          byId("initialCodeDialog").addEventListener("cancel", stopSavedCodeDialog);

          updateInitialMasterPasswordMode();
          updateInitialAutoLoginMode();'''
          if bottom_marker not in text:
              raise SystemExit("options.js bottom marker not found")
          text = text.replace(bottom_marker, bottom, 1)
          options.write_text(text, encoding="utf-8")

          popup = Path("src/popup.js")
          text = popup.read_text(encoding="utf-8")
          popup_marker = '''async function refreshCode() {'''
          popup_helpers = r'''function enhanceSecretInputs() {
            const eyeIcon = `
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                <circle cx="12" cy="12" r="2.75"></circle>
              </svg>`;
            for (const input of document.querySelectorAll('input[type="password"]')) {
              const wrapper = document.createElement("span");
              wrapper.className = "secret-input-wrap";
              input.parentNode.insertBefore(wrapper, input);
              wrapper.append(input);
              const button = document.createElement("button");
              button.type = "button";
              button.className = "password-toggle";
              button.title = "入力内容を表示";
              button.setAttribute("aria-label", "入力内容を表示");
              button.innerHTML = eyeIcon;
              button.addEventListener("click", () => {
                const visible = input.type === "text";
                input.type = visible ? "password" : "text";
                button.classList.toggle("visible", !visible);
                button.title = visible ? "入力内容を表示" : "入力内容を隠す";
                button.setAttribute("aria-label", visible ? "入力内容を表示" : "入力内容を隠す");
                input.focus();
              });
              wrapper.append(button);
            }
          }

          '''
          if popup_marker not in text:
              raise SystemExit("popup.js marker not found")
          text = text.replace(popup_marker, popup_helpers + popup_marker, 1)
          text = text.replace(
              'refreshStatus().catch((error) => message(error.message, true));',
              'enhanceSecretInputs();\nrefreshStatus().catch((error) => message(error.message, true));',
              1
          )
          popup.write_text(text, encoding="utf-8")

          css = Path("src/ui.css")
          text = css.read_text(encoding="utf-8")
          if ".secret-input-wrap" in text:
              raise SystemExit("Secret input styles already exist")
          text += r'''

          .secret-input-wrap {
            position: relative;
            display: block;
            margin-top: 5px;
          }
          .secret-input-wrap input[type="password"],
          .secret-input-wrap input[type="text"] {
            margin-top: 0;
            padding-right: 44px;
          }
          .password-toggle {
            position: absolute;
            top: 50%;
            right: 4px;
            transform: translateY(-50%);
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            margin: 0;
            padding: 6px;
            border: 0;
            background: transparent;
            color: var(--muted);
          }
          .password-toggle:hover,
          .password-toggle.visible {
            color: var(--primary);
            background: color-mix(in srgb, var(--primary) 9%, Canvas);
          }
          .password-toggle svg {
            width: 21px;
            height: 21px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
          }
          .input-requirement {
            display: block;
            margin-top: 6px;
            color: var(--muted);
            font-size: 12px;
          }
          .code-dialog {
            width: min(420px, calc(100vw - 32px));
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            background: Canvas;
            color: CanvasText;
            box-shadow: 0 16px 48px rgba(0, 0, 0, .28);
          }
          .code-dialog::backdrop {
            background: rgba(0, 0, 0, .48);
          }
          .saved-code-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin: 18px 0;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
          }
          .dialog-code {
            font-size: 34px;
            letter-spacing: .12em;
            font-variant-numeric: tabular-nums;
          }
          '''
          css.write_text(text, encoding="utf-8")

          replace_once(
              "README.md",
              '4. 「現在のコードを確認」を押し、Microsoft Authenticatorに表示されているコードと一致することを確認します。\n5. 必要な自動化項目を選択して保存します。',
              '4. 必要な自動化項目を選択して保存します。\n5. 保存後に表示されるコードが、Microsoft Authenticatorのコードと一致することを確認します。'
          )
          replace_once(
              "README.md",
              '初期設定で「マスターパスワードで保護する（推奨）」を無効にしてください。',
              'マスターパスワードは6文字以上で設定でき、数字のみでも使用できます。入力欄を選択すると要件が表示されます。\n\n初期設定で「マスターパスワードで保護する（推奨）」を無効にしてください。'
          )

          replace_all("package.json", '"version": "0.5.0"', '"version": "0.5.1"')
          replace_all("package-lock.json", '"version": "0.5.0"', '"version": "0.5.1"', minimum=2)
          replace_all("src/manifest.json", '"version": "0.5.0"', '"version": "0.5.1"')

          workflows = Path(".github/workflows")
          for workflow in workflows.iterdir():
              if workflow.is_file() and workflow.name not in {"build.yml", "release.yml"}:
                  workflow.unlink()
          PY
      - run: npm run check
      - run: npm run build
      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json package-lock.json src .github/workflows
          git commit -m "Improve credential input and setup confirmation"
          git push origin HEAD:main
      - name: Remove obsolete workflow runs
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r workflow_id workflow_name; do
            case "$workflow_name" in
              "Build extension"|"Publish release") continue ;;
            esac
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?per_page=100" \
              --jq '.workflow_runs[].id' |
            while read -r run_id; do
              [[ -z "$run_id" || "$run_id" == "$GITHUB_RUN_ID" ]] && continue
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" || true
            done
          done

  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[apply-ui-update]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run build
      - id: metadata
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('src/manifest.json', 'utf8')).version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sit-adfs-totp-autofill-chromium-v${{ steps.metadata.outputs.version }}
          path: dist/chromium/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sit-adfs-totp-autofill-firefox-v${{ steps.metadata.outputs.version }}
          path: dist/firefox/
          if-no-files-found: error
