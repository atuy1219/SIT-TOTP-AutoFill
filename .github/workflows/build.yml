name: Build extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run build
      - id: metadata
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('src/manifest.json', 'utf8')).version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sit-adfs-totp-autofill-chromium-v${{ steps.metadata.outputs.version }}
          path: dist/chromium/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sit-adfs-totp-autofill-firefox-v${{ steps.metadata.outputs.version }}
          path: dist/firefox/
          if-no-files-found: error
