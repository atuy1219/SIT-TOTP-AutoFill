name: Apply requested cleanup and commit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-expiry-wait
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def rewrite(path: str, replacements: list[tuple[str, str]]) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              for pattern, replacement in replacements:
                  text = re.sub(pattern, replacement, text, flags=re.MULTILINE | re.DOTALL)
              file.write_text(text, encoding="utf-8")

          rewrite("src/background.js", [
              (r",\n  minRemainingSeconds: 5", ""),
              (r"  const threshold = Number\(value\.minRemainingSeconds\);\n", ""),
              (r",\n    minRemainingSeconds:\n      Number\.isInteger\(threshold\) && threshold >= 0 && threshold <= 15\n        \? threshold\n        : DEFAULT_SETTINGS\.minRemainingSeconds", ""),
              (r"\n    if \(result\.remaining <= settings\.minRemainingSeconds\) \{\n      return \{\n        ok: false,\n        reason: \"wait\",\n        waitMs: \(result\.remaining \+ 1\) \* 1000\n      \};\n    \}\n", "\n"),
          ])
          rewrite("src/options.js", [
              (r",\n    minRemainingSeconds: 5", ""),
              (r",\n    minRemainingSeconds: Number\(byId\(\"minRemainingSeconds\"\)\.value\)", ""),
              (r"  byId\(\"minRemainingSeconds\"\)\.value =\n    String\(config\.settings\.minRemainingSeconds\);\n", ""),
          ])
          rewrite("src/options.html", [
              (r"        <label>\n          有効期限が残り何秒以下なら次のコードを待つか\n          <input id=\"minRemainingSeconds\" type=\"number\" min=\"0\" max=\"15\" step=\"1\">\n        </label>\n", ""),
          ])
          rewrite("src/content.js", [
              (r"      if \(response\?\.reason === \"wait\"\) \{\n        showStatus\(\"期限直前のため、次のコードを待っています。\", \"warning\"\);\n        schedule\(Math\.max\(500, Number\(response\.waitMs\) \|\| 1000\)\);\n        return true;\n      \}\n", ""),
          ])
          rewrite("README.md", [
              (r"Manifest V3", ""),
              (r"-mv3-v<version>", "-v<version>"),
          ])
          rewrite("scripts/package.mjs", [(r"-mv3-v\$\{manifest\.version\}", r"-v${manifest.version}")])
          rewrite("scripts/check.mjs", [(r" MV3 builds", " builds")])
          PY
      - run: npm run check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/background.js src/options.js src/options.html src/content.js scripts/package.mjs scripts/check.mjs
          git commit -m "Remove TOTP expiry wait and MV3 labels"
          git push origin HEAD:agent/remove-expiry-wait
